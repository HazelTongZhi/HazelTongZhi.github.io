<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Cigarette Game - Custom Pack Texture</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', 'Arial', sans-serif;
        }

        /* UI Panel */
        .stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 16px 28px;
            color: white;
            border-left: 5px solid #ff7e5e;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10;
            pointer-events: none;
            font-weight: 600;
        }
        .stats-panel h1 {
            margin: 0 0 8px 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }
        .counter {
            font-size: 2rem;
            font-weight: 800;
            margin: 5px 0;
        }
        .pack-counter {
            font-size: 1.3rem;
            background: #2c2c2c;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            margin-top: 8px;
        }
        .cig-health {
            margin-top: 12px;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 6px 12px;
            pointer-events: auto;
        }
        .health-bar-bg {
            width: 120px;
            height: 8px;
            background: #444;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: #ff7e5e;
            border-radius: 4px;
            transition: width 0.2s ease;
        }
        .smoke-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            border: none;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 14px 32px;
            border-radius: 60px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto;
        }
        .smoke-btn:active { transform: translateX(-50%) scale(0.97); }
        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 600px) {
            .stats-panel { padding: 10px 18px; }
            .counter { font-size: 1.6rem; }
            .smoke-btn { padding: 12px 24px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="stats-panel">
        <h1>🚬 BURN & SMOKE 🚬</h1>
        <div class="counter">🚬 <span id="cigCount">0</span></div>
        <div class="pack-counter">📦 Packs smoked: <span id="packCount">0</span> (20 cigs)</div>
        <div class="cig-health">
            🚬 Current cigarette health
            <div class="health-bar-bg"><div class="health-bar-fill" id="healthFill" style="width: 100%"></div></div>
        </div>
    </div>
    <button class="smoke-btn" id="smokeButton">💨 TAKE A PUFF 💨</button>
    <div class="instruction">🖱️ Click cigarette | 🔥 Drag to rotate | Each puff burns it down</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.008);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3);
        camera.lookAt(0, 0.5, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0.6, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4466cc, 0.3);
        fillLight.position.set(0, -1, 0.5);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(1, 1.2, -1.5);
        scene.add(rimLight);
        const tipGlowLight = new THREE.PointLight(0xff4400, 0.7, 2.5);
        tipGlowLight.castShadow = false;
        scene.add(tipGlowLight);

        // --- Ground & Decor ---
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.7 });
        const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), planeMat);
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.4;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        const gridHelper = new THREE.GridHelper(6, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.35;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // --- Ashtray & Props ---
        const ashtrayBase = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.8, 0.15, 32), new THREE.MeshStandardMaterial({ color: 0xaa8866, roughness: 0.4 }));
        ashtrayBase.position.set(-0.9, -0.3, 0.8);
        ashtrayBase.castShadow = true;
        scene.add(ashtrayBase);
        const ashtrayRing = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.05, 32, 64), new THREE.MeshStandardMaterial({ color: 0xccaa88 }));
        ashtrayRing.position.set(-0.9, -0.18, 0.8);
        ashtrayRing.rotation.x = Math.PI / 2;
        scene.add(ashtrayRing);
        
        // ================= CUSTOM TEXTURE FOR CIGARETTE PACK =================
        // You can replace the pack's texture in two ways:
        // 
        // 1. Use an image file (recommended): 
        //    - Place your image (e.g., "pack_design.jpg") in the same folder as this HTML.
        //    - Uncomment the code below that loads an external texture.
        //    - Make sure to adjust the path if needed.
        //
        // 2. Keep the procedural canvas texture (default) but edit the drawing commands below.
        //
        // Example using external image (uncomment and replace 'your_texture.jpg'):
        /*
        const packTextureLoader = new THREE.TextureLoader();
        const packTexture = packTextureLoader.load('your_texture.jpg');
        packTexture.colorSpace = THREE.SRGBColorSpace;
        */
        //
        // For now, I use a canvas texture that you can easily modify in code.
        
        const packGroup = new THREE.Group();
        const packBody = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.9, 0.75), new THREE.MeshStandardMaterial({ color: 0xccaa77, roughness: 0.3, metalness: 0.1 }));
        packBody.castShadow = true;
        packBody.position.y = 0;
        packGroup.add(packBody);
        
        // --- Create a canvas texture (easily customizable) ---
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 512;   // Higher resolution for sharper texture
        labelCanvas.height = 512;
        const ctx2d = labelCanvas.getContext('2d');
        
        // BACKGROUND: Change this to your brand color
        ctx2d.fillStyle = '#b87c4f';
        ctx2d.fillRect(0, 0, 512, 512);
        
        // Add a border design
        ctx2d.strokeStyle = '#e8c89a';
        ctx2d.lineWidth = 20;
        ctx2d.strokeRect(20, 20, 472, 472);
        
        // Main graphic: you can replace with your logo
        ctx2d.fillStyle = '#f5e6d3';
        ctx2d.font = 'bold 80px "Arial"';
        ctx2d.fillText("🚬", 210, 140);
        
        ctx2d.font = 'bold 48px "Poppins", "Arial"';
        ctx2d.fillStyle = '#4a2e1e';
        ctx2d.fillText("SMOKES", 170, 260);
        
        ctx2d.font = '36px "Arial"';
        ctx2d.fillStyle = '#2c1a0c';
        ctx2d.fillText("20 CLASSIC", 170, 360);
        
        // Optional warning label (small text)
        ctx2d.font = '24px "Arial"';
        ctx2d.fillStyle = '#aa8866';
        ctx2d.fillText("NOT FOR SALE", 180, 460);
        
        const packTexture = new THREE.CanvasTexture(labelCanvas);
        packTexture.colorSpace = THREE.SRGBColorSpace;
        packTexture.wrapS = THREE.RepeatWrapping;
        packTexture.wrapT = THREE.RepeatWrapping;
        
        // Apply texture to a thin plane on the front of the pack
        const packLabel = new THREE.Mesh(
            new THREE.BoxGeometry(0.55, 0.9, 0.05),
            new THREE.MeshStandardMaterial({ map: packTexture, roughness: 0.2, metalness: 0.05 })
        );
        packLabel.position.set(0, 0, 0.38);
        packGroup.add(packLabel);
        
        packGroup.position.set(1.0, -0.25, 0.9);
        packGroup.rotation.y = -0.5;
        scene.add(packGroup);
        
        // --- CIGARETTE MODEL (Ring removed) ---
        const cigaretteRoot = new THREE.Group();
        scene.add(cigaretteRoot);
        
        // Filter tip (never burns)
        const filterGeo = new THREE.CylinderGeometry(0.092, 0.092, 0.2, 24);
        const filterMat = new THREE.MeshStandardMaterial({ color: 0xcc9966, roughness: 0.5 });
        const filter = new THREE.Mesh(filterGeo, filterMat);
        filter.position.y = -0.45;
        filter.castShadow = true;
        cigaretteRoot.add(filter);
        
        // Tobacco part (burns)
        const tobaccoGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.8, 24);
        const tobaccoMat = new THREE.MeshStandardMaterial({ color: 0xf0ede8, roughness: 0.3 });
        const tobaccoPart = new THREE.Mesh(tobaccoGeo, tobaccoMat);
        tobaccoPart.castShadow = true;
        tobaccoPart.position.y = -0.05;
        cigaretteRoot.add(tobaccoPart);
        
        // Ember (tip)
        const emberMat = new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff3300, emissiveIntensity: 0.7 });
        const tipEmber = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), emberMat);
        tipEmber.castShadow = true;
        cigaretteRoot.add(tipEmber);
        
        // Glow halo
        const glowHalo = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff6633, transparent: true, opacity: 0.2, side: THREE.BackSide }));
        cigaretteRoot.add(glowHalo);
        
        cigaretteRoot.position.set(0, 0.25, 0);
        cigaretteRoot.rotation.z = 0.05;
        cigaretteRoot.rotation.x = 0.1;
        
        // --- Burn State ---
        let currentPuffs = 20;
        const MAX_PUFFS = 20;
        let totalCigarettesSmoked = 0;
        let packsSmoked = 0;
        
        const cigCountSpan = document.getElementById('cigCount');
        const packCountSpan = document.getElementById('packCount');
        const healthFillDiv = document.getElementById('healthFill');
        
        function updateUI() {
            cigCountSpan.innerText = totalCigarettesSmoked;
            packsSmoked = Math.floor(totalCigarettesSmoked / 20);
            packCountSpan.innerText = packsSmoked;
            const healthPercent = (currentPuffs / MAX_PUFFS) * 100;
            healthFillDiv.style.width = `${healthPercent}%`;
            if (healthPercent < 30) healthFillDiv.style.backgroundColor = '#ff3300';
            else healthFillDiv.style.backgroundColor = '#ff7e5e';
        }
        
        function updateCigaretteVisual() {
            const lengthRatio = currentPuffs / MAX_PUFFS;
            const fullHeight = 0.8;
            const currentHeight = fullHeight * lengthRatio;
            if (currentHeight <= 0.01) {
                tobaccoPart.visible = false;
                tipEmber.visible = false;
                glowHalo.visible = false;
                tipGlowLight.intensity = 0;
                return;
            }
            tobaccoPart.visible = true;
            tipEmber.visible = true;
            glowHalo.visible = true;
            tobaccoPart.scale.y = lengthRatio;
            const newCenterY = -0.35 + (currentHeight / 2);
            tobaccoPart.position.y = newCenterY;
            const tipY = -0.35 + currentHeight;
            tipEmber.position.y = tipY;
            glowHalo.position.y = tipY;
            tipGlowLight.intensity = 0.5 + (lengthRatio * 0.5);
        }
        
        // --- Pack Animation & Respawn ---
        let isAnimatingPack = false;
        function animatePackAndRespawn() {
            if (isAnimatingPack) return;
            isAnimatingPack = true;
            const originalScale = packGroup.scale.clone();
            const originalPos = packGroup.position.clone();
            let startTime = performance.now();
            function animatePackOpen(now) {
                const elapsed = (now - startTime) / 1000;
                let t = Math.min(1, elapsed / 0.4);
                const easeOut = 1 - Math.pow(1 - t, 1.5);
                packGroup.scale.setScalar(1 + easeOut * 0.25);
                packGroup.position.y = originalPos.y + easeOut * 0.08;
                if (t < 1) {
                    requestAnimationFrame(animatePackOpen);
                } else {
                    setTimeout(() => {
                        packGroup.scale.copy(originalScale);
                        packGroup.position.copy(originalPos);
                        isAnimatingPack = false;
                    }, 150);
                }
            }
            requestAnimationFrame(animatePackOpen);
            for (let i = 0; i < 20; i++) {
                const particle = new THREE.Mesh(new THREE.SphereGeometry(0.02, 4), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xaa4422 }));
                particle.position.copy(packGroup.position);
                particle.position.x += (Math.random() - 0.5) * 0.5;
                particle.position.y += Math.random() * 0.6;
                particle.position.z += (Math.random() - 0.5) * 0.5;
                scene.add(particle);
                setTimeout(() => scene.remove(particle), 400);
            }
        }
        
        function respawnCigarette() {
            currentPuffs = MAX_PUFFS;
            updateCigaretteVisual();
            animatePackAndRespawn();
            const tipWorld = getTipWorldPosition();
            for (let i=0;i<12;i++) spawnSmokePuffAt(tipWorld, 0.6);
        }
        
        function takePuff() {
            if (currentPuffs <= 0) {
                finishCurrentCigaretteAndReplace();
                return;
            }
            currentPuffs--;
            updateCigaretteVisual();
            updateUI();
            
            tipEmber.material.emissiveIntensity = 1.3;
            glowHalo.material.opacity = 0.5;
            tipGlowLight.intensity = 1.4;
            setTimeout(() => {
                if (currentPuffs > 0) {
                    tipEmber.material.emissiveIntensity = 0.6;
                    glowHalo.material.opacity = 0.2;
                    tipGlowLight.intensity = 0.7;
                }
            }, 180);
            
            const tipPos = getTipWorldPosition();
            spawnSmokePuffAt(tipPos);
            
            const originalCamPos = camera.position.clone();
            camera.position.x += (Math.random() - 0.5) * 0.012;
            camera.position.y += (Math.random() - 0.5) * 0.012;
            setTimeout(() => {
                let steps = 0;
                const interval = setInterval(() => {
                    if (steps < 6) {
                        camera.position.lerp(originalCamPos, 0.2);
                        steps++;
                    } else clearInterval(interval);
                }, 16);
            }, 20);
            
            cigaretteRoot.scale.set(1.02, 1.02, 1.02);
            setTimeout(() => cigaretteRoot.scale.set(1, 1, 1), 100);
            
            if (currentPuffs <= 0) {
                finishCurrentCigaretteAndReplace();
            }
        }
        
        function finishCurrentCigaretteAndReplace() {
            if (currentPuffs > 0) return;
            totalCigarettesSmoked++;
            updateUI();
            const tipPos = getTipWorldPosition();
            for (let i=0; i<30; i++) spawnSmokePuffAt(tipPos, 1.0);
            tipEmber.material.emissiveIntensity = 0;
            tipGlowLight.intensity = 0;
            setTimeout(() => {
                respawnCigarette();
                updateUI();
            }, 300);
        }
        
        // --- Smoke Particle System ---
        function createSmokeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(210,210,230,0.9)');
            grad.addColorStop(0.5, 'rgba(140,140,160,0.6)');
            grad.addColorStop(1, 'rgba(80,80,100,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }
        const smokeTexture = createSmokeTexture();
        let activeSmokes = [];
        
        function spawnSmokePuffAt(position, intensityMult = 0.8) {
            const puffCount = 6 + Math.floor(Math.random() * 8);
            for (let i=0; i<puffCount; i++) {
                const spriteMat = new THREE.SpriteMaterial({ map: smokeTexture, color: 0xd9d9e6, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.position.copy(position);
                sprite.position.x += (Math.random() - 0.5) * 0.1;
                sprite.position.y += (Math.random() - 0.5) * 0.1;
                sprite.position.z += (Math.random() - 0.5) * 0.1;
                const baseScale = 0.04 + Math.random() * 0.08;
                sprite.scale.set(baseScale, baseScale, 1);
                const vel = new THREE.Vector3((Math.random()-0.5)*0.01, 0.02 + Math.random()*0.025, (Math.random()-0.5)*0.01);
                const life = 1.0 + Math.random() * 0.8;
                scene.add(sprite);
                activeSmokes.push({ sprite, velocity: vel, life, maxLife: life, startScale: baseScale });
            }
        }
        
        function updateSmoke(delta) {
            for (let i=activeSmokes.length-1; i>=0; i--) {
                const p = activeSmokes[i];
                p.life -= delta;
                if (p.life <= 0) {
                    scene.remove(p.sprite);
                    p.sprite.material.dispose();
                    activeSmokes.splice(i,1);
                    continue;
                }
                const factor = p.life / p.maxLife;
                p.sprite.position.x += p.velocity.x * delta * 30;
                p.sprite.position.y += p.velocity.y * delta * 30;
                p.sprite.position.z += p.velocity.z * delta * 30;
                const newScale = p.startScale * (0.5 + factor * 0.8);
                p.sprite.scale.set(newScale, newScale, 1);
                p.sprite.material.opacity = factor * 0.6;
                p.velocity.y += 0.0015 * delta * 30;
            }
        }
        
        function getTipWorldPosition() {
            const tipLocal = new THREE.Vector3(0, (currentPuffs/MAX_PUFFS)*0.8 - 0.35, 0);
            return cigaretteRoot.localToWorld(tipLocal);
        }
        
        // --- Click handling ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        function onCigaretteClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const clickable = [tobaccoPart, filter, tipEmber];
            const intersects = raycaster.intersectObjects(clickable);
            if (intersects.length > 0) {
                takePuff();
                event.preventDefault();
            }
        }
        renderer.domElement.addEventListener('click', onCigaretteClick);
        document.getElementById('smokeButton').addEventListener('click', (e) => { takePuff(); e.stopPropagation(); });
        
        // --- Ambient particles & animation loop ---
        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 400;
        const dustPositions = new Float32Array(dustCount*3);
        for (let i=0;i<dustCount;i++) {
            dustPositions[i*3] = (Math.random()-0.5)*7;
            dustPositions[i*3+1] = Math.random()*2.2;
            dustPositions[i*3+2] = (Math.random()-0.5)*6;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0xffaa77, size: 0.008, transparent: true, opacity: 0.4 });
        const dustSystem = new THREE.Points(dustGeo, dustMat);
        scene.add(dustSystem);
        
        let time = 0;
        let lastFrame = performance.now();
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastFrame) / 1000);
            if (delta <= 0) delta = 0.016;
            lastFrame = now;
            updateSmoke(delta);
            
            if (currentPuffs > 0) {
                const flicker = 0.5 + Math.sin(time * 20) * 0.15;
                tipEmber.material.emissiveIntensity = Math.max(0.5, flicker * 0.9);
                tipGlowLight.intensity = 0.5 + Math.sin(time * 18) * 0.2;
                glowHalo.material.opacity = 0.15 + Math.sin(time * 12) * 0.08;
            } else {
                tipGlowLight.intensity = 0;
            }
            
            cigaretteRoot.position.y = 0.25 + Math.sin(time * 2) * 0.002;
            dustSystem.rotation.y += 0.001;
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            time += delta;
            requestAnimationFrame(animate);
        }
        
        updateCigaretteVisual();
        updateUI();
        setTimeout(() => {
            const tipPos = getTipWorldPosition();
            for (let i=0;i<8;i++) spawnSmokePuffAt(tipPos, 0.4);
        }, 500);
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('🔥 Game ready - Gold ring removed. Custom pack texture instructions available.');
    </script>
</body>
</html>
