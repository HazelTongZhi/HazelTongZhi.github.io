<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horse Plinko</title>
  <style>
    body {
      font-family: sans-serif;
      background: url('newbanner.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }

    .top-left-button {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }

    .scoreboard {
      font-size: 2.0em;
      margin-bottom: 10px;
      -webkit-text-stroke: 2px rgb(1, 122, 96);
    }

    .board {
      position: relative;
      width: 300px;
      height: 380px;
      background: url('horse1.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      background-attachment: fixed;
      border: 3px solid #fff;
      padding-top: 20px;
      overflow: hidden;
    }

    canvas {
      display: block;
      background-color: transparent;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }

    .message {
      margin-top: 5px;
      font-size: 1.5em;
      -webkit-text-stroke: 2px rgb(1, 122, 96);
    }

    .border {
      -webkit-text-stroke: 2px rgb(1, 122, 96);
    }
  </style>
</head>
<body>
  <a class="top-left-button" href="index.html">
    <button>Go to Slots!</button>
  </a>

  <h1 class="border">Horse Plinko</h1>
  <div class="scoreboard">
    Balls: <span id="ball-count">5</span> | Score: <span id="score">0</span>
  </div>
  <div class="board">
    <canvas id="gameCanvas" width="300" height="380"></canvas>
  </div>
  <div class="controls">
    <button onclick="dropAllBalls()">Drop All Balls</button>
    <button onclick="dropBall()">Drop One Ball</button>
    <button onclick="tryAgain()" id="try-again" style="display:none;">Try Again</button>
  </div>
  <div class="message" id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gravity = 0.3;
    const pegs = [];
    const slots = [100, 50, 0, 'ADD', 0, 50, 100];
    const slotWidth = canvas.width / slots.length;
    let balls = [];
    let score = 0;
    let ballCount = 5;
    let dropperX = canvas.width / 2;
    let dropperDirection = 1;
    let gameEnded = false;

    const ballImage = new Image();
    ballImage.src = 'horse2.jpg';

    function drawDropper() {
      if (ballCount > 0) {
        ctx.beginPath();
        ctx.rect(dropperX - 10, 0, 20, 10);
        ctx.fillStyle = 'lime';
        ctx.fill();
      }
    }

    function updateDropper() {
      dropperX += dropperDirection * 2;
      if (dropperX <= 10 || dropperX >= canvas.width - 10) {
        dropperDirection *= -1;
      }
    }

    function dropBall() {
      if (ballCount <= 0 || gameEnded) return;
      balls.push({ x: dropperX, y: 10, vx: 0, vy: 0 });
      ballCount--;
      document.getElementById('ball-count').textContent = ballCount;
    }

    function dropAllBalls() {
      let delay = 0;
      const count = ballCount;
      for (let i = 0; i < count; i++) {
        setTimeout(dropBall, delay);
        delay += 200;
      }
    }

    function tryAgain() {
      score = 0;
      ballCount = 5;
      balls = [];
      gameEnded = false;
      document.getElementById('score').textContent = score;
      document.getElementById('ball-count').textContent = ballCount;
      document.getElementById('message').textContent = '';
      document.getElementById('try-again').style.display = 'none';
    }

    function createPegs() {
      const rows = 5;
      const cols = 7;
      const spacingX = canvas.width / cols;
      const spacingY = 50;
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacingX + (row % 2 === 0 ? spacingX / 2 : 0);
          const y = 50 + row * spacingY;
          pegs.push({ x, y });
        }
      }
    }

    function drawPegs() {
      ctx.fillStyle = '#fff';
      pegs.forEach(peg => {
        ctx.beginPath();
        ctx.arc(peg.x, peg.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawSlots() {
      for (let i = 0; i < slots.length; i++) {
        ctx.fillStyle = '#888';
        ctx.fillRect(i * slotWidth, canvas.height - 20, slotWidth, 20);
        ctx.fillStyle = '#fff';
        ctx.fillText(slots[i], i * slotWidth + slotWidth / 2 - 10, canvas.height - 5);
      }
    }

    function updateBalls() {
      balls.forEach((ball, i) => {
        ball.vy += gravity;
        ball.x += ball.vx;
        ball.y += ball.vy;

        pegs.forEach(peg => {
          const dx = ball.x - peg.x;
          const dy = ball.y - peg.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 10) {
            const angle = Math.atan2(dy, dx);
            ball.vx = Math.cos(angle) * 1.5 + (Math.random() - 0.5);
            ball.vy = Math.sin(angle) * 1.5 + (Math.random() - 0.5);
          }
        });

        if (ball.x <= 0 || ball.x >= canvas.width) {
          ball.vx *= -1;
        }

        if (ball.y > canvas.height - 20) {
          const index = Math.floor(ball.x / slotWidth);
          const slot = slots[Math.max(0, Math.min(slots.length - 1, index))];

          if (slot === 'ADD') {
            ballCount += 5;
            document.getElementById('message').textContent = `+5 Ball from bonus slot!`;
          } else {
            score += slot;
            document.getElementById('message').textContent = `+${slot} points!`;
          }

          document.getElementById('score').textContent = score;
          document.getElementById('ball-count').textContent = ballCount;
          balls.splice(i, 1);

          if (ballCount === 0 && balls.length === 0 && !gameEnded) {
            gameEnded = true;
            setTimeout(() => {
              confetti();
              document.getElementById('message').textContent = `You won: ${score} points! 🎉`;
              document.getElementById('try-again').style.display = 'inline-block';
            }, 500);
          }
        }
      });
    }

    function drawBalls() {
      balls.forEach(ball => {
        if (ballImage.complete) {
          ctx.drawImage(ballImage, ball.x - 8, ball.y - 8, 16, 16);
        } else {
          ctx.fillStyle = 'red';
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateDropper();
      drawSlots();
      drawPegs();
      drawBalls();
      drawDropper();
      updateBalls();
      requestAnimationFrame(gameLoop);
    }

    createPegs();
    gameLoop();
  </script>
</body>
</html>
